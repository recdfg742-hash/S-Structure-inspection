name: Build S-Structure Inspector EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python numpy pillow openpyxl

      - name: 4. Build Single EXE with PyInstaller
        shell: pwsh
        run: |
          $pyFile = if (Test-Path "s_structure_inspector.py") { "s_structure_inspector.py" } else { (Get-ChildItem -Filter "*.py" | Select-Object -First 1).Name }
          if (-not $pyFile) { Write-Error "저장소에 .py 파이썬 파일이 없습니다!"; exit 1 }
          Write-Host "Target Python File: $pyFile"
          pyinstaller --noconfirm --onefile --windowed `
            --name "Aluko_S-Structure_Inspector" `
            --hidden-import "PIL._tkinter_finder" `
            --hidden-import "openpyxl.cell._writer" `
            "$pyFile"

      - name: 5. Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aluko_S-Structure_Inspector_EXE
          path: dist/Aluko_S-Structure_Inspector.exe
          if-no-files-found: error
